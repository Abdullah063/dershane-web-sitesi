# Static assets: one month; HTML must revalidate to pick up new builds.
<IfModule mod_expires.c>
ExpiresActive On
ExpiresByType text/css "access plus 1 month"
ExpiresByType application/javascript "access plus 1 month"
ExpiresByType text/javascript "access plus 1 month"
ExpiresByType image/webp "access plus 1 month"
ExpiresByType image/png "access plus 1 month"
ExpiresByType image/jpeg "access plus 1 month"
ExpiresByType image/svg+xml "access plus 1 month"
ExpiresByType font/woff2 "access plus 1 year"
</IfModule>
<IfModule mod_deflate.c>
AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript text/javascript application/json image/svg+xml
</IfModule>
<IfModule mod_headers.c>
<FilesMatch "\.html$">
Header set Cache-Control "no-cache"
</FilesMatch>
</IfModule>
# The static export has literal '?' in some versioned filenames.
# Give these files their real MIME type so compression/cache rules apply.
<FilesMatch "\.js(?:\?|%3F)">
ForceType application/javascript
</FilesMatch>
<FilesMatch "\.css(?:\?|%3F)">
ForceType text/css
</FilesMatch>
<FilesMatch "\.woff2(?:\?|%3F)">
ForceType font/woff2
</FilesMatch>
